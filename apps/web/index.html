<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sentinel is a real-time incident intelligence dashboard for earthquakes, wildfires, storms, and floods."
    />
    <title>Sentinel — Incident Intelligence</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const stored = localStorage.getItem('sentinel-theme');
        const theme = stored ? JSON.parse(stored).state.theme : 'dark';
        document.documentElement.classList.toggle('dark', theme !== 'light');
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
